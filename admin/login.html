<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | Abdellah Teha</title>

  <link rel="icon" type="image/webp" href="../at-logo.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../assets/contact-and-ui.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-card">
      <p class="admin-login-brand">Abdellah <span>Teha</span></p>
      <p class="admin-login-sub">Admin Dashboard Login</p>

      <div class="admin-login-alert" id="login-alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <a href="../index.html" class="admin-login-back">&larr; Back to website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/supabase-config.js" defer></script>
  <script src="../assets/supabase-client.js" defer></script>
  <script src="../assets/ui-helpers.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
